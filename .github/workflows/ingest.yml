name: Incremental research ingestion

on:
  workflow_dispatch:
  schedule:
    - cron: "17 1 * * *"

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch, normalize and deduplicate research metadata
        run: npm run ingest
      - name: Validate updated corpus
        run: npm test
      - name: Commit source-data changes
        run: |
          if git diff --quiet -- data/papers.json; then
            echo "No corpus changes"
            exit 0
          fi
          git config user.name "cockpitlm-ingestion[bot]"
          git config user.email "cockpitlm-ingestion[bot]@users.noreply.github.com"
          git add data/papers.json
          git commit -m "Update research corpus"
          git push
